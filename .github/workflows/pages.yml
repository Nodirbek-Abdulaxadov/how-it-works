name: Deploy to GitHub Pages

# Sayt statik: qurish bosqichi yo'q, repozitoriya o'zi shundayligicha yuklanadi.
# three.js `vendor/` ichida, importmap nisbiy yo'l ishlatadi.
#
# BIR MARTALIK SOZLASH: Settings → Pages → Source = "GitHub Actions".
# Busiz deploy "Resource not accessible by integration" bilan yiqiladi —
# GITHUB_TOKEN ga Pages saytini yaratish huquqi berilmagan.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Bir vaqtda bitta deploy; navbatdagisi oldingisini to'xtatmaydi
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
